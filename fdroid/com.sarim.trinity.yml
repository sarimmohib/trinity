# F-Droid build metadata for Trinity.
#
# F-Droid does not take APK uploads. Inclusion works by merging this file into
# their data repository as metadata/com.sarim.trinity.yml:
#
#   1. Fork https://gitlab.com/fdroid/fdroiddata
#   2. Add this file there as metadata/com.sarim.trinity.yml (keep LF endings)
#   3. Open a merge request titled "New app: Trinity"
#
# Summary, description, icon: fastlane metadata in this repo supplies them.

Categories:
  - Phone & SMS
License: MIT
AuthorName: Sarim Mohib

# The app checks GitHub for a newer release on launch, without asking first.
# F-Droid's anti-feature list counts "checking for updates without your
# knowledge or permission" as Tracking, so a reviewer will most likely ask for
# either this line or an opt-in switch. Comment it in if the check stays
# automatic; leave it out once the check only runs when the user asks for it.
#
# AntiFeatures:
#   - Tracking

SourceCode: https://github.com/sarimmohib/trinity
IssueTracker: https://github.com/sarimmohib/trinity/issues
Changelog: https://github.com/sarimmohib/trinity/releases

AutoName: Trinity

RepoType: git
Repo: https://github.com/sarimmohib/trinity.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    output: app/build/outputs/apk/release/app-release.apk
    gradle:
      - yes
